# Hält das Supabase-Projekt wach.
#
# Supabase pausiert Projekte im kostenlosen Tarif nach 7 Tagen ohne
# Datenbank-Aktivität. Zwischen zwei Umfrage-Wellen sind das schnell
# mehr als 7 Tage — die Umfragen wären dann tot, ohne dass es jemand
# merkt. Dieser Lauf ruft alle drei Tage `poll_results()` auf, das
# reicht als Lebenszeichen.
#
# Die Zugangsdaten kommen aus src/config-live.js, damit es genau EINE
# Stelle gibt, die gepflegt werden muss. Solange dort nichts eingetragen
# ist, beendet sich der Lauf still und erfolgreich.

name: Supabase wach halten

on:
  schedule:
    # 06:17 UTC, täglich (alle 3 Tage reichte im Okt. 2026 nicht).
    # Krumme Minute mit Absicht: zur vollen Stunde sind die
    # GitHub-Runner am stärksten überbucht.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Datenbank anpingen
        run: |
          URL=$(node -e "import('./src/config-live.js').then(m => process.stdout.write(m.SUPABASE.url || ''))")
          KEY=$(node -e "import('./src/config-live.js').then(m => process.stdout.write(m.SUPABASE.key || ''))")

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "src/config-live.js ist noch leer — nichts zu tun."
            exit 0
          fi

          rpc() {
            curl -sS --retry 3 --retry-delay 20 --fail-with-body -X POST "$URL/rest/v1/rpc/$1" \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              -d "$2" \
              -o /dev/null -w "$1: HTTP %{http_code} in %{time_total}s\n"
          }

          # Okt. 2026: Nur-Lese-Aufrufe alle 3 Tage haben die Pause NICHT
          # verhindert. Deshalb jetzt täglich und mit echtem Schreibzugriff:
          # eine Stimme in der Umfrage `keepalive` (zeigt die Seite nie an)
          # setzen und sofort wieder entfernen.
          V=00000000-0000-4000-8000-00000000a11e
          rpc cast_vote "{\"p_poll\":\"keepalive\",\"p_voter\":\"$V\",\"p_options\":[\"ping\"]}"
          rpc cast_vote "{\"p_poll\":\"keepalive\",\"p_voter\":\"$V\",\"p_options\":[]}"
          rpc poll_results '{}'
