<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0d150f" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta property="og:title" content="Programm · WoodBeat 2027 🌲" />
  <meta property="og:description" content="Wer spielt, wann läuft was. Drei Tage, zwei Nächte." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://vebzyyhere.github.io/woodbeat/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <title>Programm · WoodBeat 2027</title>
</head>
<body data-seite="programm">
  <a class="sprung" href="#inhalt">Zum Inhalt springen</a>

  <header class="blattkopf" id="top">
    <a class="blattkopf__zurueck daten" href="../">
      <svg viewBox="0 0 88 88" aria-hidden="true" focusable="false"><use href="#emblem-klein" /></svg>
      <span>WoodBeat <span id="kopf-jahr"></span></span>
    </a>
    <p class="blattkopf__nr daten">01</p>
    <h1 class="blattkopf__titel">Programm</h1>
    <!-- Gegenstueck in src/seiten.js (unterzeile) — beide pflegen. -->
    <p class="blattkopf__unter">Wer spielt, wann läuft was.</p>
    <div class="ornament" aria-hidden="true"></div>
  </header>

  <main id="inhalt">
    <section class="sektion" id="lineup">
      <div class="satzspiegel">
        <h2 class="sektion__titel">Line-up</h2>
        <p class="sektion__intro">Wer die Nacht übernimmt.</p>
        <ol class="lineup" id="lineup-liste"></ol>
        <p class="marginal" id="lineup-hinweis"></p>
      </div>
    </section>

    <section class="sektion sektion--laut" id="laufplan">
      <div class="satzspiegel">
        <h2 class="sektion__titel">Laufplan</h2>
        <p class="sektion__intro">Drei Tage, zwei Nächte. Tag wählen:</p>
        <div class="reiter" id="tag-reiter" role="tablist" aria-label="Festivaltag"></div>
        <!-- Die Reiter zeigen per aria-controls hierher — ohne die
             Panel-Rolle bleibt die Verbindung für Screenreader leer. -->
        <ol class="lauf" id="lauf-liste" role="tabpanel" tabindex="0"></ol>
      </div>
    </section>

    <section class="sektion" id="playlist">
      <div class="satzspiegel">
        <h2 class="sektion__titel">Playlist</h2>
        <p class="sektion__intro">Der Soundtrack. Folgen, reinwerfen, was fehlt.</p>
        <div class="etikett" id="spotify"></div>
      </div>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
