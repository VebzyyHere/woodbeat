<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0d150f" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta property="og:title" content="Abstimmen · WoodBeat 2027 🌲" />
  <meta property="og:description" content="Welcher Sound läuft nachts, was bauen wir Neues, was gibt's zu essen. Antippen zählt sofort." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://vebzyyhere.github.io/woodbeat/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <title>Abstimmen · WoodBeat 2027</title>
</head>
<body data-seite="abstimmen">
  <a class="sprung" href="#inhalt">Zum Inhalt springen</a>

  <header class="blattkopf" id="top">
    <a class="blattkopf__zurueck daten" href="../">
      <svg viewBox="0 0 88 88" aria-hidden="true" focusable="false"><use href="#emblem-klein" /></svg>
      <span>WoodBeat <span id="kopf-jahr"></span></span>
    </a>
    <p class="blattkopf__nr daten">03</p>
    <h1 class="blattkopf__titel">Stimmzettel</h1>
    <p class="blattkopf__unter">Ihr entscheidet, was gebaut wird.</p>
    <div class="ornament" aria-hidden="true"></div>
  </header>

  <main id="inhalt">
    <section class="sektion sektion--laut" id="stimmzettel">
      <div class="satzspiegel">
        <p class="sektion__kopf daten" id="zettel-kopf"></p>
        <p class="sektion__intro">
          Antippen zählt sofort — und du siehst direkt, wie die Gruppe steht.
          Meinung ändern geht jederzeit.
        </p>
        <div id="umfragen"></div>
        <div class="zettel__aktion">
          <button class="taste" type="button" id="zettel-teilen">Auszählung in die Gruppe</button>
          <p class="marginal" id="zettel-modus"></p>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
