<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0d150f" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta property="og:title" content="Tickets · WoodBeat 2027 🌲" />
  <meta property="og:description" content="25 € fürs ganze Wochenende, 10 € pro Tag. Trag dich ein, damit wir planen können." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://vebzyyhere.github.io/woodbeat/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <title>Tickets · WoodBeat 2027</title>
</head>
<body data-seite="tickets">
  <a class="sprung" href="#inhalt">Zum Inhalt springen</a>

  <header class="blattkopf" id="top">
    <a class="blattkopf__zurueck daten" href="../">
      <svg viewBox="0 0 88 88" aria-hidden="true" focusable="false"><use href="#emblem-klein" /></svg>
      <span>WoodBeat <span id="kopf-jahr"></span></span>
    </a>
    <p class="blattkopf__nr daten">02</p>
    <h1 class="blattkopf__titel">Tickets</h1>
    <!-- Gegenstueck in src/seiten.js (unterzeile) — beide pflegen. -->
    <p class="blattkopf__unter">Was es kostet — und wer schon dabei ist.</p>
    <div class="ornament" aria-hidden="true"></div>
  </header>

  <main id="inhalt">
    <!-- Die einzige helle Sektion der Seite. Eine Inversion ist eine
         Zäsur, zwei wären ein Muster. -->
    <section class="sektion sektion--hell" id="preise">
      <div class="satzspiegel">
        <h2 class="sektion__titel">Preise</h2>
        <p class="sektion__intro">Zwei Möglichkeiten, mehr nicht.</p>
        <div class="pressungen" id="tickets-liste"></div>
        <p class="marginal" id="tickets-hinweis"></p>

        <h3 class="unter-titel">Die Bar</h3>
        <p class="sektion__intro">
          Für alle mit Tagesticket — und alle, die keine Lust aufs Schleppen haben.
        </p>
        <div class="bar" id="bar-liste"></div>
      </div>
    </section>

    <!-- Direkt nach dem Preis kommt die Zusage. -->
    <section class="sektion" id="wer-kommt">
      <div class="satzspiegel">
        <h2 class="sektion__titel">Wer kommt</h2>
        <p class="sektion__intro">
          Trag dich ein, damit wir Essen und Platz planen können.
        </p>

        <p class="zaehler" id="rsvp-zaehler" aria-live="polite"></p>
        <p class="marginal" id="rsvp-aufteilung"></p>

        <form class="rsvp" id="rsvp-form" novalidate>
          <div class="feld">
            <label class="feld__label daten" for="rsvp-name">Dein Name</label>
            <input class="feld__eingabe" id="rsvp-name" name="name" type="text"
              autocomplete="given-name" maxlength="40" required placeholder="Vorname reicht" />
          </div>

          <fieldset class="feld feld--wahl">
            <legend class="feld__label daten">Was nimmst du?</legend>
            <div class="reiter reiter--wahl" id="rsvp-ticket"></div>
          </fieldset>

          <div class="feld">
            <label class="feld__label daten" for="rsvp-notiz">Anmerkung (optional)</label>
            <input class="feld__eingabe" id="rsvp-notiz" name="notiz" type="text"
              maxlength="140" placeholder="Komme später, bringe Grill mit, …" />
          </div>

          <!-- Die Meldung steht ÜBER den Knöpfen: darunter läge sie auf
               dem Handy unterhalb der Falz, wenn der Fokus nach oben springt. -->
          <p class="marginal" id="rsvp-status" aria-live="polite"></p>
          <div class="rsvp__aktion">
            <button class="taste taste--voll" type="submit" id="rsvp-senden">Ich bin dabei</button>
            <button class="taste taste--leise" type="button" id="rsvp-loeschen" hidden>Eintrag löschen</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
